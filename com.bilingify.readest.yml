id: com.bilingify.readest

runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node26
  - org.freedesktop.Sdk.Extension.rust-stable

command: readest
rename-desktop-file: Readest.desktop
rename-icon: readest

finish-args:
  # The CEF runtime drives Chromium's X11 backend (XWayland on Wayland
  # sessions), so the app runs on X11 only; Flathub does not allow both
  # sockets, and the winit window follows the webview onto X11.
  - --socket=x11
  - --socket=pulseaudio
  - --device=all
  - --share=ipc
  - --share=network
  - --talk-name=org.freedesktop.secrets

modules:
  # Chromium cannot use its setuid/user-namespace sandbox inside Flatpak;
  # zypak redirects the sandboxed helper processes through flatpak-spawn.
  - name: zypak
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2025.09
        commit: 693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53

  - name: readest
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node26/bin:/usr/lib/sdk/rust-stable/bin:/run/build/readest/pnpm/bin
      env:
        CARGO_HOME: /run/build/readest/cargo
        # Playwright's browsers only serve the e2e tests; their downloads are
        # not vendored, so its postinstall must not look for them.
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        # cef-dll-sys and the tauri CLI look for <CEF_PATH>/<cef version>/<os_arch>/
        # and only download when it is missing; the archive below is unpacked there.
        CEF_PATH: /run/build/readest/cef
        # On Linux `pnpm tauri` runs this unpacked copy of @tauri-apps/cli-cef
        # instead of fetching it with `pnpm dlx`.
        TAURI_CEF_CLI: /run/build/readest/cli-cef/tauri.js

    sources:
      - type: git
        url: https://github.com/readest/readest.git
        commit: fd9f0c0645b8350ed83bc02ddefbbfc598115d33
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.1.1.tgz
        sha256: 05b282d06332295c736f0b20c8bdf185325bf1bca682c91ed81154a3c6851cc0
        dest: pnpm
      # Generated from Cargo.cef.lock (the CEF build's lockfile), not Cargo.lock.
      - cargo-sources.json
      - node-sources.json

      # CEF binary distribution, the same "minimal" package the `cef` crate
      # downloads, laid out the way download-cef caches it.
      - type: archive
        only-arches: [x86_64]
        url: https://cef-builds.spotifycdn.com/cef_binary_151.3.24%2Bg2384915%2Bchromium-151.0.7922.174_linux64_minimal.tar.bz2
        sha256: db53c43fdace8b7ee4af0f005120116d6973aa9d8eb7702c0617badf9be8684e
        dest: cef/151.3.24/cef_linux_x86_64
      - type: inline
        only-arches: [x86_64]
        dest: cef/151.3.24/cef_linux_x86_64
        dest-filename: archive.json
        contents: |
          {"type": "minimal", "name": "cef_binary_151.3.24+g2384915+chromium-151.0.7922.174_linux64_minimal.tar.bz2", "sha1": "b1e99d3e3ff4213f99f7cda0211db89454398811"}
      - type: archive
        only-arches: [aarch64]
        url: https://cef-builds.spotifycdn.com/cef_binary_151.3.24%2Bg2384915%2Bchromium-151.0.7922.174_linuxarm64_minimal.tar.bz2
        sha256: 47965b9c36a5958bdd6d6fdb3fe3360f38d17d65914ef636abade14881cdc59b
        dest: cef/151.3.24/cef_linux_aarch64
      - type: inline
        only-arches: [aarch64]
        dest: cef/151.3.24/cef_linux_aarch64
        dest-filename: archive.json
        contents: |
          {"type": "minimal", "name": "cef_binary_151.3.24+g2384915+chromium-151.0.7922.174_linuxarm64_minimal.tar.bz2", "sha1": "95acd2a46975e2c60afa6b427ec50c0a3be6236f"}
      # download-cef flattens the distribution: the contents of Release/ and
      # Resources/ sit next to the headers, and that is where cef-dll-sys and
      # the tauri CLI expect libcef.so, the .pak files and locales/.
      - type: shell
        commands:
          - for d in cef/151.3.24/cef_linux_*; do mv "$d"/Release/* "$d"/Resources/* "$d"/ && rmdir "$d"/Release "$d"/Resources; done

      # The tauri CLI from upstream's feat/cef branch (the one that bundles CEF).
      - type: archive
        url: https://registry.npmjs.org/@tauri-apps/cli-cef/-/cli-cef-3.0.0-alpha.27.tgz
        sha512: 42972d3ab1b7743be12a1496aa0153003cb042051a3c104cde79a2ebcf0faf5b42d51c4018cac67b00018ddac4a720315a734a67e366ca1703ba99239850de2e
        dest: cli-cef
      - type: archive
        only-arches: [x86_64]
        url: https://registry.npmjs.org/@tauri-apps/cli-cef-linux-x64-gnu/-/cli-cef-linux-x64-gnu-3.0.0-alpha.27.tgz
        sha512: a79b035f046eb3344456b9615bb0a9ce4de7cf99ea1421643f4c816b03abb620e4503ced620d349d514484cac46ea2521e025537a076c3c842077790938bdfaf
        dest: cli-cef/node_modules/@tauri-apps/cli-cef-linux-x64-gnu
      - type: archive
        only-arches: [aarch64]
        url: https://registry.npmjs.org/@tauri-apps/cli-cef-linux-arm64-gnu/-/cli-cef-linux-arm64-gnu-3.0.0-alpha.27.tgz
        sha512: 934c3af21ebd5e4a5ca0c6e9734907cabc88865582f4ff9f41e7d5356cef49c6237782ee66b8bc45c96cb0224f1ca4d59a53fc6ffefac236cd79a44442fd4950
        dest: cli-cef/node_modules/@tauri-apps/cli-cef-linux-arm64-gnu

      - type: script
        dest-filename: readest-launcher.sh
        commands:
          - export ZYPAK_CEF_LIBRARY_PATH=/app/share/Readest/libcef.so
          - exec zypak-wrapper /app/share/Readest/readest "$@"

    build-commands:
      - ln -s pnpm.mjs pnpm/bin/pnpm
      - pnpm install --offline
      - pnpm --filter @readest/readest-app setup-vendors
      - "sed -i 's/\"createUpdaterArtifacts\": true/\"createUpdaterArtifacts\": false/' apps/readest-app/src-tauri/tauri.conf.json"
      - pnpm --filter @readest/readest-app tauri build --bundles deb
      # The CEF deb puts the executable and the CEF distribution under
      # usr/share/Readest with usr/bin/readest as a symlink into it.
      # /app/bin already holds zypak, so merge instead of moving the tree.
      - cp -a target/release/bundle/deb/Readest*/data/usr/. /app/
      # Preserve OAuth callback URLs when the desktop launches the app.
      - sed -i 's|^Exec=readest$|Exec=readest %u|' /app/share/applications/Readest.desktop
      - rm /app/bin/readest
      - install -Dm755 readest-launcher.sh /app/bin/readest
      - install -Dm644 data/metainfo/appdata.xml /app/share/metainfo/$FLATPAK_ID.metainfo.xml
